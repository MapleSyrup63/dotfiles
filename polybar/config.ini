; M A I N   C O L O R S
[colors]
; i really dig the red and black color scheme
background = #BB000000
text = #bbFFFFFF
brightred = #FF0000
dimred = #950101
darkred = #3D0000


; M A I N   B A R
[bar/example]
# bar size settings
width = 100%
border-right-size = 0%
border-left-size = 0%
height = 25pt
# background and foreground colors
background = ${colors.background}
foreground = ${colors.text}
; border settings
line-size = 2pt
border-size = 0pt
border-color = brightred
; padding
padding-left = 1
padding-right = 2
module-margin = 1
; separator
separator = |
separator-foreground = ${colors.brightred}
; default font to be used
font-0 = "FiraMono Nerd Font:size=10.5;2"
; modules to be shown an their location
modules-left = i3
modules-center = date
modules-right = xkeyboard systray filesystem memory cpu powermenu
; pointer management
cursor-click = pointer
cursor-scroll = ns-resize
; no idea honestly xd
enable-ipc = true
; compatible with i3
wm-restack = i3

; S Y S T E M   T R A Y
[module/systray]
type = internal/tray
format-margin = 2pt
tray-spacing = 8pt
tray-size = 12pt

[module/i3]
type = internal/i3
pin-workspaces = true
format = <label-state>
label-alignment = center
label-focused = %name%
label-focused-underline = ${colors.dimred}
label-focused-padding = 2
label-active = %name%
label-active-background = ${colors.dimred}
label-active-underline= ${colors.brightred}
label-active-padding = 2
label-occupied = %name%
label-occupied-padding = 2
label-urgent = %name%
label-urgent-background = ${colors.dimred}
label-urgent-padding = 2
label-empty = %name%
label-empty-foreground = ${colors.background}
label-empty-padding = 2

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout = %layout%
label-layout-foreground = ${colors.text}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.text}
label-indicator-background = ${colors.darkred}

[module/filesystem]
type = internal/fs
interval = 60
mount-0 = /
label-mounted = %{}󱛟 SSD:%{F-} %percentage_used%%
label-mounted-foreground = ${colors.dimred}
label-unmounted = %mountpoint% not mounted
label-unmounted-foreground = ${colors.background}

[module/memory]
type = internal/memory
interval = 2
format-prefix = " RAM: "
format-prefix-foreground = ${colors.dimred}
label = %percentage_used:2%%


[module/cpu]
type = internal/cpu
interval = 2
format-prefix = " CPU:"
format-prefix-foreground = ${colors.dimred}
label = %percentage:2%%

; S Y S T E M   T R A Y
[module/powermenu]
type = custom/text
content = ⏻
click-left = xfce4-session-logout


[module/date]
type = internal/date
interval = 1
date = %Y-%m-%d%
time = %H:%M:%S
label = %date% %time%
label-foreground = ${colors.text}


[settings]

screenchange-reload = true
pseudo-transparency = true

